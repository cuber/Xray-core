syntax = "proto3";

package xray.transport.internet.hysteria;
option csharp_namespace = "Xray.Transport.Internet.Hysteria";
option go_package = "github.com/xtls/xray-core/transport/internet/hysteria";
option java_package = "com.xray.transport.internet.hysteria";
option java_multiple_files = true;

message Config {
  reserved 1;
  string auth = 2;

  int64 udp_idle_timeout = 3;

  string masq_type = 4;

  string masq_file = 5;

  string masq_url = 6;
  bool masq_url_rewrite_host = 7;
  bool masq_url_x_forwarded = 8;
  bool masq_url_insecure = 9;

  string masq_string = 10;
  map<string, string> masq_string_headers = 11;
  int32 masq_string_status_code = 12;

  // A session owner's connection pool (spec024 R1, R4); unset keeps one connection per outbound.
  Session session = 13;
}

message Session {
  uint32 min_connections = 1;
  uint32 max_connections = 2;
  uint32 streams_per_connection = 3;
  uint32 scale_up_streams = 4;
  // The relay outbounds' credentials, index = position + 1; filled when the configuration is built
  // (spec024 R2). ListOutbounds already returns each of them in its relay outbound's settings.
  repeated string relay_auth = 5;
}