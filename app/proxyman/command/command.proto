syntax = "proto3";

package xray.app.proxyman.command;
option csharp_namespace = "Xray.App.Proxyman.Command";
option go_package = "github.com/xtls/xray-core/app/proxyman/command";
option java_package = "com.xray.app.proxyman.command";
option java_multiple_files = true;

import "common/protocol/user.proto";
import "common/serial/typed_message.proto";
import "core/config.proto";

message AddUserOperation {
  xray.common.protocol.User user = 1;
}

message RemoveUserOperation {
  string email = 1;
}

message AddInboundRequest {
  core.InboundHandlerConfig inbound = 1;
}

message AddInboundResponse {}

message RemoveInboundRequest {
  string tag = 1;
}

message RemoveInboundResponse {}

message AlterInboundRequest {
  string tag = 1;
  xray.common.serial.TypedMessage operation = 2;
}

message AlterInboundResponse {}

message ListInboundsRequest {
  bool isOnlyTags = 1;
}

message ListInboundsResponse {
  repeated core.InboundHandlerConfig inbounds = 1;
}

message GetInboundUserRequest {
  string tag = 1;
  string email = 2;
}

message GetInboundUserResponse {
  repeated xray.common.protocol.User users = 1;
}

message GetInboundUsersCountResponse {
  int64 count = 1;
}

message AddOutboundRequest {
  core.OutboundHandlerConfig outbound = 1;
}

message AddOutboundResponse {}

message RemoveOutboundRequest {
  string tag = 1;
}

message RemoveOutboundResponse {}

message AlterOutboundRequest {
  string tag = 1;
  xray.common.serial.TypedMessage operation = 2;
}

message AlterOutboundResponse {}

message ListOutboundsRequest {}

message ListOutboundsResponse {
  repeated core.OutboundHandlerConfig outbounds = 1;
}

message GetInboundMuxStatsRequest {
  // Empty selects every inbound.
  string tag = 1;
}

message SingMuxStats {
  bool enabled = 1;
  uint32 max_streams = 2;
  // Active carriers by stream protocol: smux, yamux, h2mux.
  map<string, uint64> active_carriers = 3;
  uint64 active_padded_carriers = 4;
  uint64 active_tcp_streams = 5;
  uint64 active_udp_streams = 6;
  uint64 total_carriers = 7;
  uint64 total_streams = 8;
  // Refusals by reason: preamble, closed, limit, revoked, invalid, nested, dispatch.
  map<string, uint64> rejected = 9;
}

message MuxCoolStats {
  uint64 active_carriers = 1;
  uint64 active_streams = 2;
  uint64 total_carriers = 3;
}

message InboundMuxStats {
  string tag = 1;
  SingMuxStats sing_mux = 2;
  MuxCoolStats mux_cool = 3;
}

message GetInboundMuxStatsResponse {
  repeated InboundMuxStats inbounds = 1;
}

// spec021 R3: the QUIC connections of handlers whose stream settings build them (Hy2).
message GetQuicStatsRequest {
  // Empty selects every inbound and outbound.
  string tag = 1;
  // Adds one row per live connection, at most 256 per handler.
  bool connections = 2;
}

// The loss recovery, copy (spec021) and padding (spec025) settings after defaults, as the connections use them.
message QuicEffective {
  uint32 max_ack_delay_ms = 1;
  uint32 ack_eliciting_threshold = 2;
  uint32 initial_rtt_ms = 3;
  // 0: the PTO doubles without limit.
  uint32 pto_backoff_limit = 4;
  double loss_time_threshold = 5;
  uint32 loss_packet_threshold = 6;
  // 0: no copies by size.
  uint32 duplicate_max_size = 7;
  bool duplicate_tail = 8;
  uint32 duplicate_delay_ms = 9;
  // spec025 R4: "random" (Hy2's random padding) or "off" (hysteriaSettings.disablePadding), from the handler's
  // loaded Hy2 settings; empty from a Core before spec025, which consumers show as unavailable.
  string padding = 10;
}

message QuicCounters {
  // Originals only; copies are counted separately.
  uint64 packets_sent = 1;
  uint64 bytes_sent = 2;
  // Processed packets; duplicates_received counts the ones dropped as duplicates.
  uint64 packets_received = 3;
  uint64 bytes_received = 4;
  // Ack-eliciting packets declared lost, whatever the congestion controller.
  uint64 packets_lost = 5;
  uint64 bytes_lost = 6;
  // Declared lost and acknowledged later.
  uint64 spurious_losses = 7;
  uint64 pto_count = 8;
  uint64 copies_sent = 9;
  uint64 copy_bytes_sent = 10;
  // Copies not sent because a queue was full.
  uint64 copies_skipped = 11;
  uint64 duplicates_received = 12;
}

message QuicConnection {
  string remote = 1;
  // An inbound connection's authenticated user, by email.
  string user = 2;
  int64 age_ms = 3;
  int64 smoothed_rtt_us = 4;
  int64 min_rtt_us = 5;
  int64 latest_rtt_us = 6;
  int64 rtt_variance_us = 7;
  QuicCounters counters = 8;
  // spec024 R7, a session owner's connection: active, draining, spare or suspect.
  string state = 9;
  uint64 streams_open = 10;
  // The relay bindings negotiated on the connection: on an owner's row every index, on a server's row the
  // relayed users it accepted.
  repeated QuicRelayBinding relay = 11;
}

message QuicRelayBinding {
  uint32 index = 1;
  // By email; empty when the server refused the credential.
  string user = 2;
  // ok, unknown or denied.
  string status = 3;
}

// spec024 R7, a session owner's pool.
message QuicSession {
  uint32 min = 1;
  uint32 max = 2;
  uint32 active = 3;
  uint32 draining = 4;
  uint32 spare = 5;
  uint32 suspect = 6;
  uint64 streams_open = 7;
}

// spec024 R7, a relay outbound.
message QuicRelay {
  string session = 1;
  // By email, once a connection has bound it.
  string user = 2;
  // bound, unknown, denied, unsupported or no_connection.
  string status = 3;
}

message QuicHandlerStats {
  string tag = 1;
  // inbound or outbound.
  string direction = 2;
  // hysteria.
  string transport = 3;
  QuicEffective effective = 4;
  // Since the handler started; a closed connection's counters stay in them.
  QuicCounters totals = 5;
  uint64 connections_active = 6;
  uint64 connections_total = 7;
  repeated QuicConnection connections = 8;
  bool truncated = 9;
  QuicSession session = 10;
  QuicRelay relay = 11;
}

message GetQuicStatsResponse {
  repeated QuicHandlerStats handlers = 1;
}

// spec026 R2: an inbound's live objects, or one user's.
message ConnectionCounts {
  // Accepted stream-transport connections that are not Hy2, bound to a user or not.
  uint64 tcp = 1;
  // Those of the tcp connections that are carriers.
  uint64 mux_cool_carriers = 2;
  uint64 sing_mux_carriers = 3;
  // Live Hy2 QUIC connections.
  uint64 hy2_connections = 4;
  // Hy2 TCP streams and UDP sessions.
  uint64 hy2_streams = 5;
  uint64 hy2_udp_sessions = 6;
  // SS-2022 multi-user UDP sessions.
  uint64 udp_sessions = 7;
}

message GetConnectionsRequest {
  // Empty selects every inbound.
  repeated string tags = 1;
  // Adds one row per user with a live object.
  bool user_rows = 2;
  // With user_rows, only these users, by email, case-insensitive.
  repeated string users = 3;
}

message ConnectionUser {
  string user = 1;
  ConnectionCounts counts = 2;
}

message InboundConnections {
  string tag = 1;
  ConnectionCounts counts = 2;
  // Connections, streams and QUIC connections not bound to a user: in their handshake, refused, falling back.
  uint64 unbound = 3;
  // Objects a CloseConnections call is still closing; not in counts.
  uint64 closing = 4;
  // From the inbound's multiplexing servers, as GetInboundMuxStats reports them.
  uint64 mux_cool_streams = 5;
  uint64 sing_mux_streams = 6;
  // Active sing-mux carriers by stream protocol: smux, yamux, h2mux.
  map<string, uint64> sing_mux_protocols = 7;
  // By email; at most 4096.
  repeated ConnectionUser users = 8;
  bool truncated = 9;
}

message GetConnectionsResponse {
  repeated InboundConnections inbounds = 1;
}

// spec026 R3.
message CloseConnectionsRequest {
  // By email, case-insensitive. Exactly one of users and all_users.
  repeated string users = 1;
  // Every bound user on the inbounds named in tags, which it requires.
  bool all_users = 2;
  // Empty with users: every inbound.
  repeated string tags = 3;
  repeated string exclude_users = 4;
  // Logged with the closure.
  string reason = 5;
}

message InboundClosed {
  string tag = 1;
  // The objects the call selected and closed.
  ConnectionCounts closed = 2;
  // Closes still running when the call returned; they finish on their own.
  uint64 pending = 3;
}

message CloseConnectionsResponse {
  repeated InboundClosed inbounds = 1;
}

service HandlerService {
  rpc AddInbound(AddInboundRequest) returns (AddInboundResponse) {}

  rpc RemoveInbound(RemoveInboundRequest) returns (RemoveInboundResponse) {}

  rpc AlterInbound(AlterInboundRequest) returns (AlterInboundResponse) {}

  rpc ListInbounds(ListInboundsRequest) returns (ListInboundsResponse) {}

  rpc GetInboundUsers(GetInboundUserRequest) returns (GetInboundUserResponse) {}

  rpc GetInboundUsersCount(GetInboundUserRequest) returns (GetInboundUsersCountResponse) {}

  rpc GetInboundMuxStats(GetInboundMuxStatsRequest) returns (GetInboundMuxStatsResponse) {}

  rpc GetQuicStats(GetQuicStatsRequest) returns (GetQuicStatsResponse) {}

  rpc GetConnections(GetConnectionsRequest) returns (GetConnectionsResponse) {}

  rpc CloseConnections(CloseConnectionsRequest) returns (CloseConnectionsResponse) {}

  rpc AddOutbound(AddOutboundRequest) returns (AddOutboundResponse) {}

  rpc RemoveOutbound(RemoveOutboundRequest) returns (RemoveOutboundResponse) {}

  rpc AlterOutbound(AlterOutboundRequest) returns (AlterOutboundResponse) {}

  rpc ListOutbounds(ListOutboundsRequest) returns (ListOutboundsResponse) {}
}

message Config {}
