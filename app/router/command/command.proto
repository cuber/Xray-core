syntax = "proto3";

package xray.app.router.command;
option csharp_namespace = "Xray.App.Router.Command";
option go_package = "github.com/xtls/xray-core/app/router/command";
option java_package = "com.xray.app.router.command";
option java_multiple_files = true;

import "common/net/network.proto";
import "common/serial/typed_message.proto";
import "app/router/config.proto";

// RoutingContext is the context with information relative to routing process.
// It conforms to the structure of xray.features.routing.Context and
// xray.features.routing.Route.
message RoutingContext {
  string InboundTag = 1;
  xray.common.net.Network Network = 2;
  repeated bytes SourceIPs = 3;
  repeated bytes TargetIPs = 4;
  uint32 SourcePort = 5;
  uint32 TargetPort = 6;
  string TargetDomain = 7;
  string Protocol = 8;
  string User = 9;
  map<string, string> Attributes = 10;
  repeated string OutboundGroupTags = 11;
  string OutboundTag = 12;
  repeated bytes LocalIPs = 13;
  uint32 LocalPort = 14;
  uint32 VlessRoute = 15;
}

// SubscribeRoutingStatsRequest subscribes to routing statistics channel if
// opened by xray-core.
// * FieldSelectors selects a subset of fields in routing statistics to return.
// Valid selectors:
//  - inbound: Selects connection's inbound tag.
//  - network: Selects connection's network.
//  - ip: Equivalent as "ip_source" and "ip_target", selects both source and
//  target IP.
//  - port: Equivalent as "port_source" and "port_target", selects both source
//  and target port.
//  - domain: Selects target domain.
//  - protocol: Select connection's protocol.
//  - user: Select connection's inbound user email.
//  - attributes: Select connection's additional attributes.
//  - outbound: Equivalent as "outbound" and "outbound_group", select both
//  outbound tag and outbound group tags.
// * If FieldSelectors is left empty, all fields will be returned.
message SubscribeRoutingStatsRequest {
  repeated string FieldSelectors = 1;
}

// TestRouteRequest manually tests a routing result according to the routing
// context message.
// * RoutingContext is the routing message without outbound information.
// * FieldSelectors selects the fields to return in the routing result. All
// fields are returned if left empty.
// * PublishResult broadcasts the routing result to routing statistics channel
// if set true.
message TestRouteRequest {
  RoutingContext RoutingContext = 1;
  repeated string FieldSelectors = 2;
  bool PublishResult = 3;
}

message PrincipleTargetInfo {
  repeated string tag = 1;
}

message OverrideInfo {
  string target = 2;
}

// spec017: one level of a balancer's fallback chain.
message FallbackHop {
  string tag = 1;
  // `tag` names a balancer of this router; false: an outbound tag, which ends the chain.
  bool balancer = 2;
  // For a balancer hop: its strategy yields no candidate now, so its picks use its own fallback (an
  // override on that hop still wins), as FallbackInfo.active.
  bool active = 3;
  // The hop's strategy reports `active`.
  bool reported = 4;
}

// spec016: the balancer's fallbackTag and whether new picks end on it.
message FallbackInfo {
  // The fallbackTag as loaded; empty when the balancer has none.
  string tag = 1;
  // The strategy currently yields no candidate, so new picks use `tag` (an override still wins).
  bool active = 2;
  // The strategy reports `active`: every strategy since spec017 (weightedLeastPing only in spec016).
  bool reported = 3;
  // spec017: `tag` names a balancer, whose pick continues the chain.
  bool balancer = 4;
  // spec017: the chain after this balancer, resolved on one balancer map. chain[0] is `tag`; the last hop is an
  // outbound, or a balancer without a fallbackTag. Empty when the balancer has no fallbackTag.
  repeated FallbackHop chain = 5;
}

message BalancerMsg {
  OverrideInfo override = 5;
  PrincipleTargetInfo principle_target = 6;
  FallbackInfo fallback = 7;
}

message GetBalancerInfoRequest {
  string tag = 1;
}

message GetBalancerInfoResponse {
  BalancerMsg balancer = 1;
}

// spec017: every balancer, from one balancer map, in tag order.
message ListBalancersRequest {}

message BalancerItem {
  string tag = 1;
  BalancerMsg balancer = 2;
}

message ListBalancersResponse {
  repeated BalancerItem balancers = 1;
}

// spec017 L8: what the routing loop guards stopped since start.
message GetLoopGuardsRequest {}

message GetLoopGuardsResponse {
  // Picks whose fallback chain exceeded the balancer map (a Core defect; expected to stay zero).
  uint64 fallback_chain = 1;
  // Connections that came back to a loopback outbound they had passed.
  uint64 loopback_reentry = 2;
}

message OverrideBalancerTargetRequest {
  string balancerTag = 1;
  string target = 2;
}

message OverrideBalancerTargetResponse {}

message AddRuleRequest {
  xray.common.serial.TypedMessage config = 1;
  bool shouldAppend = 2;
}
message AddRuleResponse {}

message RemoveRuleRequest {
  string ruleTag = 1;
}

message RemoveRuleResponse {}

message ListRuleRequest {}

message ListRuleItem {
  string tag = 1;
  string ruleTag = 2;
  xray.app.router.RoutingRule rule = 3;
}

message ListRuleResponse{
  repeated ListRuleItem rules = 1;
}

service RoutingService {
  rpc SubscribeRoutingStats(SubscribeRoutingStatsRequest)
      returns (stream RoutingContext) {}
  rpc TestRoute(TestRouteRequest) returns (RoutingContext) {}

  rpc GetBalancerInfo(GetBalancerInfoRequest) returns (GetBalancerInfoResponse){}
  rpc OverrideBalancerTarget(OverrideBalancerTargetRequest) returns (OverrideBalancerTargetResponse) {}
  // spec017
  rpc ListBalancers(ListBalancersRequest) returns (ListBalancersResponse) {}
  rpc GetLoopGuards(GetLoopGuardsRequest) returns (GetLoopGuardsResponse) {}
  
  rpc AddRule(AddRuleRequest) returns (AddRuleResponse) {}
  rpc RemoveRule(RemoveRuleRequest) returns (RemoveRuleResponse) {}

  rpc ListRule(ListRuleRequest) returns (ListRuleResponse) {}
}

message Config {}
